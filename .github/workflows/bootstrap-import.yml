name: Bootstrap File 15 import

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'baseline/file-15-original-import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct and verify original package
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 > /tmp/file15-package.b64
          base64 --decode /tmp/file15-package.b64 > /tmp/15-radar-symptom-and-remedy-analysis-foundation-0.1.0.zip
          echo "d317c8a532fb1d9047c95d44c2c88dfd2fd73680baf0e4ac50426a63779c0bf2  /tmp/15-radar-symptom-and-remedy-analysis-foundation-0.1.0.zip" | sha256sum --check -
          unzip -t /tmp/15-radar-symptom-and-remedy-analysis-foundation-0.1.0.zip
          python3 - <<'PY'
          import sys
          import zipfile

          archive = '/tmp/15-radar-symptom-and-remedy-analysis-foundation-0.1.0.zip'
          with zipfile.ZipFile(archive) as package:
              unsafe = [
                  name for name in package.namelist()
                  if name.startswith(('/', '\\')) or '..' in name.split('/')
              ]
          if unsafe:
              print('Unsafe archive paths detected:', *unsafe, sep='\n')
              sys.exit(1)
          print('Archive paths are safe.')
          PY

      - name: Extract exact source and remove bootstrap material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf radar-foundation
          unzip -q /tmp/15-radar-symptom-and-remedy-analysis-foundation-0.1.0.zip
          test "$(find radar-foundation -type f | wc -l)" -eq 18
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit imported source to pull-request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import original File 15 plugin source"
          git push origin HEAD:${{ github.head_ref }}
