name: Baseline Integrity

on:
  push:
    branches:
      - main
      - baseline/file-15-original-import
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integrity:
    name: Integrity and syntax checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Verify imported source checksums
        run: sha256sum --check CHECKSUMS.sha256

      - name: Lint all PHP files
        run: find radar-foundation -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: node --check radar-foundation/assets/js/radar.js

      - name: Confirm expected baseline file count
        run: test "$(find radar-foundation -type f | wc -l)" -eq 18
