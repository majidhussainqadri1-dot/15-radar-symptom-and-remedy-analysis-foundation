name: File 15 Quality Gates

on:
  push:
    branches:
      - main
      - baseline/file-15-original-import
      - fix/file-15-corrective-release-0.1.1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php-version }} quality gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.3']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Verify corrected source checksums
        run: sha256sum --check CHECKSUMS.sha256

      - name: Lint all PHP files
        run: find radar-foundation tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: node --check radar-foundation/assets/js/radar.js

      - name: Run static regression gates
        run: php tests/static-regression.php

      - name: Confirm corrected plugin version
        run: |
          grep -Fq 'Version: 0.1.1' radar-foundation/radar-foundation.php
          grep -Fq "define( 'SRF_VERSION', '0.1.1' );" radar-foundation/radar-foundation.php

      - name: Confirm expected plugin source count
        run: test "$(find radar-foundation -type f | wc -l)" -eq 18
